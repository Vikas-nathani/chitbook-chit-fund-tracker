# ChitBook stack. Every value comes from .env (no defaults here).
#   api  - FastAPI backend          -> host port ${API_PORT}
#   web  - Expo web build + nginx   -> host port ${WEB_PORT} (proxies /api to the api service)
#   database: the host's Postgres on ${DB_PORT}, reached via host.docker.internal
#             (allowed for ${DOCKER_SUBNET} in pg_hba.conf by scripts/setup-db.sh)

services:
  api:
    build: ./apps/api
    container_name: chitbook_api
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Logs are JSON lines on stdout: docker compose logs -f api
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE}
        max-file: ${LOG_MAX_FILES}
    restart: unless-stopped
    networks:
      - chitbook

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ""
    container_name: chitbook_web
    environment:
      TZ: ${TZ}
      API_UPSTREAM: ${API_UPSTREAM}
      API_PORT: ${API_PORT}
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chitbook

networks:
  chitbook:
    name: chitbook_net
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}
