[project]
name = "chitbook-api"
version = "1.0.0"
description = "ChitBook chit fund tracker API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "reportlab>=4.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.2.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chitbook_api"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# long request lines and compound asserts read better unwrapped in tests
"tests/**" = ["S105", "S106", "E501", "PT018", "ASYNC240"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["chitbook_api"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
