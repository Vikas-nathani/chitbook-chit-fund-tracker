spring.application.name=${APP_NAME}
server.port=${SERVER_PORT}

# Every value below comes from the environment (.env via docker compose); nothing is hardcoded.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER}

# Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL}
# Timestamps are written/read in the app timezone (IST)
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ}
spring.jackson.time-zone=${TZ}

# Admin account created on first start if missing (never wipes data)
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS}
