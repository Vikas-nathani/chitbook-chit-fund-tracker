spring.application.name=chit
server.port=${SERVER_PORT:8080}

# SQL (env vars override these; docker-compose sets them)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chitfund_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Admin account created on first start if missing (never wipes data)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

